{% extends "expenses/base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="mb-4">
                        Set Monthly Budget
                    </h3>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Month
                            </label>

                            <input
                                type="month"
                                name="month"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Budget Amount
                            </label>

                            <input
                                type="number"
                                name="amount"
                                class="form-control"
                                placeholder="Example: 20000"
                                step="0.01"
                                min="0"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Set Budget
                        </button>

                        <a
                            href="{% url 'dashboard' %}"
                            class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
