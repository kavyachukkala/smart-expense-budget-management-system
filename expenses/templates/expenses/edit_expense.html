{% extends "expenses/base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="mb-4">
                        Edit Expense
                    </h3>

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Title -->

                        <div class="mb-3">

                            <label class="form-label">
                                Expense Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ expense.title }}"
                                required
                            >

                        </div>


                        <!-- Category -->

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                name="category"
                                class="form-select"
                                required
                            >

                                {% for category in categories %}

                                <option
                                    value="{{ category.id }}"
                                    {% if category.id == expense.category.id %}
                                    selected
                                    {% endif %}
                                >
                                    {{ category.name }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Amount -->

                        <div class="mb-3">

                            <label class="form-label">
                                Amount
                            </label>

                            <input
                                type="number"
                                name="amount"
                                class="form-control"
                                value="{{ expense.amount }}"
                                step="0.01"
                                min="0"
                                required
                            >

                        </div>


                        <!-- Date -->

                        <div class="mb-3">

                            <label class="form-label">
                                Date
                            </label>

                            <input
                                type="date"
                                name="date"
                                class="form-control"
                                value="{{ expense.date|date:'Y-m-d' }}"
                                required
                            >

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Enter expense description"
                            >{{ expense.description }}</textarea>

                        </div>


                        <!-- Buttons -->

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Update Expense
                        </button>

                        <a
                            href="{% url 'transaction_history' %}"
                            class="btn btn-secondary ms-2">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
